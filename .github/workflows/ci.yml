name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify bootstrap security invariants
        run: python3 tools/check_security_invariants.py
      - name: Run executable security models
        run: python3 -m unittest discover -s tools/security_model -p 'test_*.py'

  android:
    needs: security-contracts
    uses: jasmin-abernathy/app-build-factory/.github/workflows/android-build.yml@main
    with:
      java_version: "17"
      android_platform: "36"
      build_tools: "35.0.0"
      gradle_tasks: "testDebugUnitTest assembleDebug lintDebug"
      artifact_path: "app/build/outputs/apk/debug/app-debug.apk"
      artifact_name: "resilience-vault-debug"
      retention_days: 3
